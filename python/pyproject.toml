[project]
authors = [{name = "Michaël SOK", email = "michael.sok@credit-agricole-sa.fr"}]
dependencies = []
name = "quant"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
quant = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.1,<3"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
testfixtures = "*"
mock = "*"

[tool.pixi.feature.dev.dependencies]
ipdb = "*"

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.environments.test]
features = ["test"]
solve-group = "default"

[tool.pixi.environments.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
testfixtures = ">=12.0.1,<13"
ipdb = ">=0.13.13,<0.14"
